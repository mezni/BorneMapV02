[project]
name = "aether-rag"
version = "0.1.2"
description = "Production-grade, highly observable RAG platform for Aether Wireless"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "PyYAML>=6.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "ui", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["app", "ui", "tests"]
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
