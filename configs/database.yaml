# PostgreSQL, pgvector and full-text search configuration.

connection:
  url: postgresql+psycopg2://aether:aether@localhost:5432/aether_rag
  pool_size: 10
  max_overflow: 5
  pool_timeout_seconds: 30.0
  echo: false

vector_index:
  dims: 1536
  m: 16
  ef_construction: 64
  distance: cosine   # cosine | l2 | inner_product

fulltext:
  language: english
  tsvector_config: english